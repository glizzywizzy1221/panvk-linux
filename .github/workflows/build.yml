name: build-panvk-linux

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git gcc g++ cmake ninja-build pkg-config bison flex \
            python3-pip python3-mako python3-yaml python3-ply python3-pycparser python3-packaging \
            llvm-18-dev clang-18 libclang-18-dev libclang-cpp18-dev libclc-18-dev libllvmspirvlib-18-dev \
            spirv-tools spirv-headers glslang-tools libvulkan-dev \
            libdrm-dev libwayland-dev wayland-protocols \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-sync-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-randr0-dev libxshmfence-dev libxrandr-dev \
            zlib1g-dev libzstd-dev libexpat1-dev libelf-dev
          pip3 install --user --break-system-packages "meson>=1.4.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build newer SPIRV-Tools (Ubuntu's version is too old)
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git spirv-headers
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Tools.git spirv-tools
          cmake -S spirv-headers -B spirv-headers/build -G Ninja -DCMAKE_INSTALL_PREFIX="$HOME/spv"
          cmake --install spirv-headers/build
          cmake -S spirv-tools -B spirv-tools/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$HOME/spv" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSPIRV-Headers_SOURCE_DIR="$PWD/spirv-headers" \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_WERROR=OFF
          cmake --build spirv-tools/build
          cmake --install spirv-tools/build
          echo "PKG_CONFIG_PATH=$HOME/spv/lib/pkgconfig:$HOME/spv/share/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/spv/lib" >> "$GITHUB_ENV"

      - name: Get source (FristOneRR PanVK, tag v1.2.0-beta)
        run: git clone --depth 1 --branch v1.2.0-beta https://github.com/FristOneRR-Admin/FristOneRR-Panvk-Source src
        
      - name: Patch - report a render node
        working-directory: src
        run: |
          F=src/panfrost/vulkan/panvk_vX_physical_device.c
          sed -i 's/if (device->drm.primary_rdev) {/if (1) {/' $F
          sed -i 's/major(device->drm.primary_rdev)/226/; s/minor(device->drm.primary_rdev)/0/' $F
          sed -i 's/if (device->drm.render_rdev) {/if (1) {/' $F
          sed -i 's/major(device->drm.render_rdev)/226/; s/minor(device->drm.render_rdev)/128/' $F
          git diff $F
          if git diff --quiet $F; then echo "PATCH DID NOT APPLY"; exit 1; fi
          
      - name: Create stub liblog (Android logging library does not exist on Linux)
        run: |
          mkdir -p "$HOME/stub/lib"
          cat > "$HOME/stub/log_stub.c" <<'EOF'
          #include <stdarg.h>
          #include <stdio.h>
          #include <stdlib.h>
          int __android_log_vprint(int prio, const char *tag, const char *fmt, va_list ap) {
            if (getenv("ANDROID_LOG_STDERR")) {
              fprintf(stderr, "[%s] ", tag ? tag : "log");
              vfprintf(stderr, fmt, ap);
              fputc('\n', stderr);
            }
            return 0;
          }
          int __android_log_print(int prio, const char *tag, const char *fmt, ...) {
            va_list ap;
            va_start(ap, fmt);
            __android_log_vprint(prio, tag, fmt, ap);
            va_end(ap);
            return 0;
          }
          int __android_log_write(int prio, const char *tag, const char *text) {
            if (getenv("ANDROID_LOG_STDERR"))
              fprintf(stderr, "[%s] %s\n", tag ? tag : "log", text ? text : "");
            return 0;
          }
          void __android_log_assert(const char *cond, const char *tag, const char *fmt, ...) {
            abort();
          }
          EOF
          clang-18 -O2 -fPIC -c "$HOME/stub/log_stub.c" -o "$HOME/stub/log_stub.o"
          ar rcs "$HOME/stub/lib/liblog.a" "$HOME/stub/log_stub.o"
          echo "LIBRARY_PATH=$HOME/stub/lib" >> "$GITHUB_ENV"

      - name: Configure
        working-directory: src
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          meson --version
          meson setup build \
            --prefix=/usr \
            -Dbuildtype=release \
            -Dplatforms=x11,wayland \
            -Dvulkan-drivers=panfrost \
            -Dpanfrost-kmds=kbase \
            -Dgallium-drivers= \
            -Dvulkan-layers= \
            -Dopengl=false \
            -Dgbm=disabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dllvm=enabled \
            -Dmesa-clc=enabled \
            -Dprecomp-compiler=enabled \
            -Dinstall-mesa-clc=false \
            -Dinstall-precomp-compiler=false \
            -Dshader-cache-default=true \
            -Dvulkan-manifest-per-architecture=false \
            -Dzlib=enabled \
            -Dselinux=false \
            -Dbuild-tests=false \
            -Dpanfrost-rust=false

      - name: Build
        working-directory: src
        run: ninja -C build

      - name: Install into dist folder
        working-directory: src
        run: meson install -C build --destdir "$GITHUB_WORKSPACE/dist" --strip

      - name: Show result
        run: |
          find dist -type f | sort
          LIB=$(find dist -name 'libvulkan_panfrost.so' | head -n 1)
          echo "Library: $LIB"
          ldd "$LIB" || true
          find dist -name '*.json' -exec cat {} \;

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: panvk-linux-aarch64
          path: dist
