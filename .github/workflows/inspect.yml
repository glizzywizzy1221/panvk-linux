name: inspect-panvk-source

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Get source
        run: git clone --depth 1 --branch v1.2.0-beta https://github.com/FristOneRR-Admin/FristOneRR-Panvk-Source src

      - name: Find the HOSTIMP code
        run: |
          cd src
          grep -rnI -C25 "HOSTIMP" src/panfrost | head -150
          echo "=========== MEM_IMPORT mentions"
          grep -rnI "MEM_IMPORT" src/panfrost | head -20
